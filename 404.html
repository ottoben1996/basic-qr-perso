<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="robots" content="noindex" />
    <title>Basic QR — page introuvable</title>
    <link rel="icon" href="./icons/icon-192.png" />
    <!-- Page autonome : aucun asset relatif, pour rester lisible depuis n’importe quelle URL. -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f3f0e8;
        --surface: #fffdf7;
        --ink: #15140f;
        --ink-2: #555146;
        --muted: #6b6659;
        --line: #b9b2a2;
        --accent: #ff5a00;
        --accent-ink: #180800;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #131210;
          --surface: #1b1a17;
          --ink: #f4f0e6;
          --ink-2: #c2bcaf;
          --muted: #9b9588;
          --line: #4a463d;
          --accent: #ff6414;
          --accent-ink: #160700;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
      }
      .box {
        width: 100%;
        max-width: 380px;
      }
      .wordmark {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .wordmark span {
        color: var(--accent);
        padding: 0 1px;
      }
      .rule {
        margin: 22px 0 28px;
        border-top: 1px dashed var(--line);
      }
      .code {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(34px, 9vw, 46px);
        font-weight: 800;
        line-height: 0.96;
        letter-spacing: -0.045em;
      }
      p {
        margin: 0 0 26px;
        max-width: 32ch;
        color: var(--ink-2);
        font-size: 14.5px;
        line-height: 1.5;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 16px;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="wordmark">basic<span>/</span>qr</div>
      <div class="rule"></div>
      <p class="code">Erreur 404</p>
      <h1>Cette page<br />n’existe pas.</h1>
      <p>Le lien est peut-être incomplet, ou l’adresse a changé.</p>
      <a id="home" href="/">Revenir à Basic QR</a>
    </main>
    <script>
      // La page 404 est servie pour n’importe quelle URL : on remonte au premier
      // segment du chemin, qui correspond au projet sur GitHub Pages.
      var first = location.pathname.split("/").filter(Boolean)[0];
      document.getElementById("home").href = first ? "/" + first + "/" : "/";
    </script>
  </body>
</html>
